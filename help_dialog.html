<!-- At runtime, we replace this help_dialog.css URL with the extension's help_dialog.css file path -->
<link rel="stylesheet" href="help_dialog.css" type="text/css" />
<div id="help-dialog-modal-background">
  <div id="help-dialog">
    <header class="dialog-header">
      <div class="dialog-title-block">
        <h1 class="dialog-title">SheetKeys shortcuts</h1>
        <p class="dialog-subtitle">Click the pencil to rebind. Press <kbd>Esc</kbd> to close.</p>
      </div>
      <a href="#" class="close" aria-label="Close"><i class="icon-cancel-circled"></i></a>
    </header>
    <!-- tabindex is required so this can be programmatically focused for keyboard scrolling. -->
    <div class="dialog-body" tabindex="0">
      <div class="groups-grid">
        <!-- Card template — populateDialog() clones this for each group. -->
        <section class="group-card" data-template>
          <h2 class="group-title">Movement</h2>
          <ul class="binding-list">
            <!-- Row template — populateDialog() clones this for each binding. -->
            <li class="binding-row" data-command="the-command" data-template>
              <div class="binding-label">
                <span class="display-name">Move left</span>
                <span class="validation-error"></span>
              </div>
              <div class="binding-shortcut">
                <span class="shortcut" tabindex="0"></span>
              </div>
              <div class="binding-actions">
                <a href="#" class="edit" aria-label="Edit binding"><i class="icon-pencil"></i></a>
                <span class="editing-controls" style="visibility: hidden">
                  <a href="#" class="save">save</a>
                  <a href="#" class="cancel">cancel</a>
                  <a href="#" class="default">default</a>
                </span>
              </div>
            </li>
          </ul>
        </section>
      </div>
    </div>
  </div>
</div>
